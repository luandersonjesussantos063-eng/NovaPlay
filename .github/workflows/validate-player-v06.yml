name: Validar player horizontal v0.6
on:
  push:
    paths:
      - '.github/workflows/validate-player-v06.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-player:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Checagem de JavaScript
        run: |
          node --check app.js
          node --check catalog.js
          node --check sw.js
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --no-audit --no-fund puppeteer-core@24.17.0
          which google-chrome
      - name: Verificar clique, tela cheia, paisagem e retorno
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          cat > /tmp/check-player.cjs <<'JS'
          const pup=require(process.cwd()+"/node_modules/puppeteer-core");
          const assert=require("node:assert/strict");
          (async()=>{
            const browser=await pup.launch({executablePath:"/usr/bin/google-chrome",headless:true,args:["--no-sandbox","--autoplay-policy=no-user-gesture-required"]});
            const page=await browser.newPage();
            const errors=[];page.on("pageerror",e=>errors.push(String(e)));
            await page.setViewport({width:393,height:852,deviceScaleFactor:1,isMobile:true,hasTouch:true});
            await page.goto("http://127.0.0.1:8765",{waitUntil:"domcontentloaded",timeout:30000});
            await page.waitForSelector(".shelf .poster-card .card-direct-play",{timeout:12000});
            const covers=await page.$$eval(".poster-card .card-direct-play",buttons=>buttons.length);
            assert(covers>=7,"Botões play não foram adicionados às capas");
            console.log("COVERS_WITH_PLAY "+covers);
            await page.evaluate(()=>{
              Element.prototype.requestFullscreen=function(){window.__requestedFullScreen=true;return Promise.reject(new Error("Full screen not available in simulated browser"))};
              if(screen.orientation) Object.defineProperty(screen.orientation,"lock",{value:()=>{window.__attemptedOrientationLock=true;return Promise.reject(new Error("lock not available"))},configurable:true});
            });
            await page.click("#hero-info");
            assert(await page.$eval("#detail-layer",x=>!x.hidden),"A ficha do título não abriu");
            assert(await page.$eval("#detail-preview-play",x=>getComputedStyle(x).display!=="none"),"Play destaque ausente");
            assert(await page.$eval("#detail-play",x=>x.textContent.includes("Assistir")),"Botão assistir ausente");
            await page.click("#detail-play");
            const playing=await page.evaluate(()=>{
              const p=document.querySelector("#player-layer");
              const rect=p.getBoundingClientRect();
              return {visible:!p.hidden,cinema:p.classList.contains("cinema"),rotated:p.classList.contains("force-landscape"),requested:window.__requestedFullScreen||false,width:Math.round(rect.width),height:Math.round(rect.height),rawWidth:Math.round(parseFloat(getComputedStyle(p).width)),rawHeight:Math.round(parseFloat(getComputedStyle(p).height)),rotation:getComputedStyle(p).transform,viewport:[innerWidth,innerHeight],detailsHidden:document.querySelector("#detail-layer").hidden};
            });
            console.log("LANDSCAPE_FALLBACK "+JSON.stringify(playing));
            assert(playing.visible&&playing.cinema&&playing.detailsHidden,"O player não abriu direto");
            assert(playing.requested,"Fullscreen não foi solicitado");
            assert(playing.rotated,"CSS de orientação paisagem não foi acionado");
            assert(playing.rawWidth>playing.rawHeight&&playing.rotation!=="none","O player não foi girado para visualização horizontal");
            await page.click("#player-close");
            assert(await page.$eval("#player-layer",x=>x.hidden&&!x.classList.contains("force-landscape")),"Não voltou ao retrato ao fechar");
            const before=await page.$eval("#detail-layer",x=>x.hidden);
            assert(before,"Ficha não fechou corretamente");
            await page.click(".shelf .poster-card .card-direct-play");
            assert(await page.$eval("#player-layer",x=>!x.hidden&&x.classList.contains("cinema")),"Play direto do card não abriu");
            await page.keyboard.press("Escape");
            assert(await page.$eval("#player-layer",x=>x.hidden),"Escape não fecha o player");
            await page.click(".mobile-chips button[data-nav='series']");
            await page.click("#category-grid .poster-card .cover-btn");
            assert.equal(await page.$$eval("#episode-list .episode",x=>x.length),9,"Episódios da série não estão acessíveis");
            await page.click("#episode-list .episode");
            assert(await page.$eval("#player-layer",x=>!x.hidden&&x.classList.contains("cinema")),"Episódio não abre direto em paisagem");
            await page.click("#player-back");
            assert(await page.$eval("#player-layer",x=>x.hidden),"O botão voltar não restaurou a tela");
            console.log("PLAY_TEST_OK; browser_errors="+JSON.stringify(errors));
            assert.equal(errors.length,0,"Foram detectados erros de JavaScript");
            await browser.close();
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          JS
          node /tmp/check-player.cjs
