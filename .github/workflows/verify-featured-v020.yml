name: Verificar gestão de destaques v020
on:
  push:
    paths:
      - .github/workflows/verify-featured-v020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar sintaxe dos scripts
        run: |
          node --check app.js
          node --check admin/admin.js
      - name: Instalar navegador de teste
        run: npm install --no-audit --no-fund --no-save puppeteer-core@24.17.0
      - name: Teste de seleção, gravação e exibição do banner no Android
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-http.log 2>&1 &
          cat > /tmp/featured-test.cjs <<'JS'
          
          const puppeteer=require(process.cwd()+"/node_modules/puppeteer-core");
          const assert=require("node:assert/strict");
          const mock=String.raw`
          const row={"id":"11111111-2222-4333-8444-555555555555","title":"Filme de Teste Autorizado","kind":"movie","is_published":true,"catalog_only":false,"youtube_id":"M7lc1UVf-VE","video_path":null,"google_drive_id":null,"poster_path":null,"genre":"Aventura","description":"Filme de teste","production_year":2026,"rights_reviewed":true};
          let saved=["upload-11111111-2222-4333-8444-555555555555","lua"];
          window.supabase={createClient:()=>({
           auth:{getUser:async()=>({data:{user:{id:"admin-mock",email:"owner@example.com"}},error:null}),onAuthStateChange:()=>({data:{subscription:{unsubscribe(){}}}})},
           rpc:async()=>({data:true,error:null}),
           storage:{from:()=>({getPublicUrl:()=>({data:{publicUrl:"https://example.com/poster.png"}})})},
           from:(table)=>{
            const q={};
            q.select=()=>q;q.eq=()=>q;q.order=()=>q;q.gte=()=>q;q.in=()=>q;
            q.maybeSingle=async()=>({data:table==="novaplay_featured"?{film_ids:saved}:table==="novaplay_admins"?{user_id:"admin-mock"}:null,error:null});
            q.range=async()=>({data:table==="novaplay_library"?[row]:[],error:null});
            q.update=change=>({eq:()=>({select:()=>({single:async()=>{saved=change.film_ids;return{data:{film_ids:saved},error:null}}}})})});
            return q;
           }
          })};
          `;
          (async()=>{
           const browser=await puppeteer.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox"]});
           try{
            const page=await browser.newPage();
            await page.setViewport({width:393,height:852,isMobile:true,hasTouch:true});
            const errors=[];
            const interceptor=async req=>{
             if(req.url().includes("supabase-js@2.58.0/dist/umd/supabase.min.js"))
              return req.respond({status:200,contentType:"text/javascript",body:mock});
             if(req.url().startsWith("https://cdn.jsdelivr.net/"))
              return req.respond({status:200,contentType:"text/javascript",body:""});
             req.continue();
            };
            page.on("pageerror",e=>errors.push(e.message));
            await page.setRequestInterception(true);page.on("request",interceptor);
            await page.goto("http://127.0.0.1:8765/admin/",{waitUntil:"domcontentloaded",timeout:20000});
            await page.waitForFunction(()=>!document.querySelector("#dashboard").hidden&&document.querySelectorAll(".featured-entry").length===2,{timeout:16000}).catch(async e=>{console.log("ADMIN_DIAG",JSON.stringify(await page.evaluate(()=>({loading:document.querySelector("#loading")?.hidden,dashboard:document.querySelector("#dashboard")?.hidden,login:document.querySelector("#login-view")?.hidden,pending:document.querySelector("#pending-view")?.hidden,featured:document.querySelectorAll(".featured-entry").length,featuredMessage:document.querySelector("#featured-message")?.textContent,authMessage:document.querySelector("#auth-message")?.textContent,uploadMessage:document.querySelector("#upload-message")?.textContent,body:document.body.innerText.slice(0,750)}))),JSON.stringify(errors));throw e});
            const initial=await page.evaluate(()=>({
             titles:[...document.querySelectorAll(".featured-entry-info strong")].map(x=>x.textContent),
             choices:[...document.querySelectorAll("#featured-film-select option")].map(x=>x.textContent),
             overflow:document.documentElement.scrollWidth-innerWidth
            }));
            assert.deepEqual(initial.titles,["Filme de Teste Autorizado","Viagem à Lua"]);
            assert(initial.choices.some(x=>x.includes("Nosferatu")));
            assert(initial.overflow<=2,"Admin overflow on Android screen");
            console.log("FEATURED_ADMIN_INITIAL_OK",JSON.stringify(initial));
            await page.$eval("#featured-add",b=>b.click());
            await page.waitForFunction(()=>document.querySelectorAll(".featured-entry").length===3&&document.querySelector("#featured-message").textContent.includes("salvos"),{timeout:7000});
            await page.$eval(".featured-entry:nth-child(3) .featured-entry-actions button:first-child",b=>b.click());
            await page.waitForFunction(()=>document.querySelector(".featured-entry:nth-child(2) .featured-entry-info strong").textContent==="O Mundo Perdido",{timeout:7000});
            console.log("FEATURED_ADMIN_SAVE_REORDER_OK");
            assert(!errors.length,"Admin JS exceptions: "+JSON.stringify(errors));
            const viewer=await browser.newPage();
            viewer.on("pageerror",e=>errors.push(e.message));
            await viewer.setRequestInterception(true);viewer.on("request",interceptor);
            await viewer.goto("http://127.0.0.1:8765/",{waitUntil:"domcontentloaded",timeout:20000});
            await viewer.waitForFunction(()=>document.querySelector("#hero-title").textContent==="Filme de Teste Autorizado",{timeout:18000});
            assert.equal(await viewer.$eval("#hero-genre",e=>e.textContent),"AVENTURA");
            assert.equal(await viewer.$$eval(".hero-dot",x=>x.length),2);
            await viewer.$eval(".hero-dot:nth-child(2)",b=>b.click());
            assert.equal(await viewer.$eval("#hero-title",e=>e.textContent),"Viagem à Lua");
            assert(!errors.length,"Site JS exceptions: "+JSON.stringify(errors));
            console.log("FEATURED_PUBLIC_HERO_OK");
           }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          
          JS
          node /tmp/featured-test.cjs
