name: Validar prévias com áudio e gêneros V 0.24
on:
  push:
    paths:
      - .github/workflows/verify-preview-genres-v024.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verificar JavaScript
        run: |
          node --check app.js
          node --check admin/admin.js
      - name: Preparar navegador
        run: npm install --no-audit --no-fund --no-save puppeteer-core@24.17.0
      - name: Testar Android, áudio e categorias
        shell: bash
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/server.log 2>&1 &
          cat > /tmp/novaplay-v024-test.cjs <<'JS'
          
          const puppeteer=require(process.cwd()+"/node_modules/puppeteer-core");
          const assert=require("node:assert/strict");
          const MOCK="window.supabase={createClient:()=>({auth:{getUser:async()=>({data:{user:null},error:null})},\nfrom:(table)=>{const q={};q.select=()=>q;q.eq=()=>q;q.order=()=>q;\nq.range=async()=>({data:table==='novaplay_library'?[{\"id\":\"11111111-2222-4333-8444-555555555555\",\"title\":\"A Era do Gelo\",\"description\":\"Filme em destaque\",\"kind\":\"movie\",\"series_title\":null,\"episode_number\":null,\"genre\":\"Animação\",\"production_year\":2026,\"video_path\":null,\"youtube_id\":null,\"google_drive_id\":\"1S2m9A_fK5dlTPM7B6vN90t\",\"google_drive_resource_key\":null,\"poster_path\":null,\"duration_seconds\":1200,\"catalog_only\":false,\"created_at\":\"2026-10-10T00:00:00Z\"},{\"id\":\"22222222-3333-4444-8555-666666666666\",\"title\":\"13 Fantasmas\",\"description\":\"Filme em destaque\",\"kind\":\"movie\",\"series_title\":null,\"episode_number\":null,\"genre\":\"Terror\",\"production_year\":2026,\"video_path\":null,\"youtube_id\":null,\"google_drive_id\":\"1S2m9A_fK5dlTPM7B6vN90t\",\"google_drive_resource_key\":null,\"poster_path\":null,\"duration_seconds\":1200,\"catalog_only\":false,\"created_at\":\"2026-10-10T00:00:00Z\"}]:[],error:null});\nq.maybeSingle=async()=>({data:table==='novaplay_featured'?{film_ids:[\"upload-11111111-2222-4333-8444-555555555555\",\"upload-22222222-3333-4444-8555-666666666666\"]}:null,error:null});\nreturn q;}})};";
          (async()=>{
           const browser=await puppeteer.launch({headless:true,executablePath:"/usr/bin/google-chrome",args:["--no-sandbox"]});
           try{
            const page=await browser.newPage();
            const errors=[];
            page.on("pageerror",e=>errors.push(e.message));
            await page.setViewport({width:393,height:852,isMobile:true,hasTouch:true});
            await page.setRequestInterception(true);
            page.on("request",r=>{
             if(r.url().includes("supabase-js@2.58.0/dist/umd/supabase.min.js"))
              return r.respond({status:200,contentType:"text/javascript",body:MOCK});
             if(r.url().includes("drive.google.com/file/")||r.url().includes("youtube-nocookie.com/embed/"))
              return r.respond({status:200,contentType:"text/html",body:"<!doctype html><title>Official player placeholder</title>"});
             if(r.url().startsWith("https://cdn.jsdelivr.net/"))
              return r.respond({status:200,contentType:"text/javascript",body:""});
             r.continue();
            });
            await page.goto("http://127.0.0.1:8765/",{waitUntil:"domcontentloaded",timeout:25000});
            await page.waitForFunction(()=>document.querySelector("#hero-title").textContent==="A Era do Gelo",{timeout:18000});
            assert.equal(await page.$eval("#hero-preview-open",x=>x.textContent.trim()),"Prévia com som");
            console.log("FEATURED_PREVIEW_BUTTON_OK");
            await page.$eval("#hero-preview-open",x=>x.click());
            await page.waitForFunction(()=>!document.querySelector("#hero-preview-panel").hidden,{timeout:4500});
            const state=await page.evaluate(()=>({
             title:document.querySelector("#hero-preview-heading").textContent,
             iframe:document.querySelector("#hero-preview-frame").src,
             videoHidden:document.querySelector("#hero-preview-video").hidden,
             message:document.querySelector("#hero-preview-feedback").textContent
            }));
            assert(state.iframe.includes("drive.google.com/file/d/"));
            assert(state.videoHidden&&state.message.includes("Google Drive"));
            console.log("FEATURED_DRIVE_AUDIO_PREVIEW_OK",JSON.stringify(state));
            await page.$eval("#hero-preview-close",x=>x.click());
            assert.equal(await page.$eval("#hero-preview-panel",x=>x.hidden),true);
            assert.equal(await page.$eval("#hero-preview-frame",x=>x.src),"about:blank");
            await page.$eval(".hero-dot:nth-child(2)",x=>x.click());
            assert.equal(await page.$eval("#hero-title",x=>x.textContent),"13 Fantasmas");
            console.log("FEATURED_SWITCH_STOPS_PREVIEW_OK");
            await page.$eval('[data-nav="filmes"]',x=>x.click());
            await page.waitForFunction(()=>!document.querySelector("#genre-filter-panel").hidden,{timeout:3500});
            const chips=await page.$$eval(".genre-chip",els=>els.map(x=>x.textContent));
            assert(chips.some(x=>x.includes("Animação"))&&chips.some(x=>x.includes("Terror")));
            await page.evaluate(()=>[...document.querySelectorAll(".genre-chip")].find(x=>x.textContent.includes("Terror")).click());
            assert.equal(await page.$eval("#category-heading",x=>x.textContent),"Terror");
            const titles=await page.$$eval("#category-grid .poster-card h3",els=>els.map(x=>x.textContent));
            assert(titles.includes("13 Fantasmas")&&!titles.includes("A Era do Gelo"),"Genre filtering returned incorrect films: "+JSON.stringify(titles));
            console.log("FILM_GENRE_FILTERS_OK",JSON.stringify({chips,titles}));
            const overflow=await page.evaluate(()=>document.documentElement.scrollWidth-innerWidth);
            assert(overflow<=2,"Android viewport overflow "+overflow);
            assert(!errors.length,"Browser errors: "+JSON.stringify(errors));
            console.log("NOVAPLAY_AUDIO_GENRES_E2E_PASS");
           }finally{await browser.close()}
          })().catch(e=>{console.error(e.stack||e);process.exit(1)});
          
          JS
          node /tmp/novaplay-v024-test.cjs
